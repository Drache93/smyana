# Builds the macOS download of Smyana: the Lobster fork at the commit Creel names, the game and its baked pictures,
# and a Smyana.command to double-click. Runs on a push to main, on a change to this file or to tools/package-macos.sh,
# and by hand (Actions, "macOS build", Run workflow). The zip is the run's artifact "Smyana-macos".
name: macOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/macos-build.yml", "tools/package-macos.sh", "tools/lobster.sh", "play.sh"]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Lobster, as a player's first ./play.sh gets it (tools/lobster.sh)
        run: |
          env -u LOBSTER tools/lobster.sh
          ls -la .lobster/bin
      - name: The route plays through with no window
        run: |
          cd src
          ../.lobster/bin/lobster run_check.lobster 2>&1 | grep -v 'warning:' | tee /dev/stderr | grep -q '^run_check: ok$'
      - name: Package
        run: tools/package-macos.sh "$PWD/.lobster" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: Smyana-macos
          path: ${{ runner.temp }}/out/Smyana-macos.zip
          if-no-files-found: error
